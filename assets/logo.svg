<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="120">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Keyboard Motif Icon -->
  <g transform="translate(30, 25)">
    <!-- Base plate -->
    <rect x="0" y="0" width="70" height="70" rx="14" fill="#0F172A" stroke="url(#grad-accent)" stroke-width="2.5"/>
    <!-- Piano keys pattern -->
    <rect x="12" y="14" width="8" height="42" rx="3" fill="#F8FAFC"/>
    <rect x="23" y="14" width="8" height="42" rx="3" fill="#F8FAFC"/>
    <rect x="34" y="14" width="8" height="42" rx="3" fill="#F8FAFC"/>
    <rect x="45" y="14" width="8" height="42" rx="3" fill="#F8FAFC"/>
    <!-- Black keys -->
    <rect x="18" y="14" width="6" height="24" rx="2" fill="#0F172A"/>
    <rect x="29" y="14" width="6" height="24" rx="2" fill="#0F172A"/>
    <rect x="40" y="14" width="6" height="24" rx="2" fill="#0F172A"/>
    <!-- Musical note float -->
    <circle cx="58" cy="18" r="3" fill="#38BDF8" filter="url(#glow)"/>
  </g>

  <!-- Title Text -->
  <text x="120" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">
    op-lead<tspan fill="url(#grad-accent)">-with-us</tspan>
  </text>

  <!-- Subtitle -->
  <text x="122" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" fill="#94A3B8">
    OPUS ARCHITECT · FLASH WORKERS · ANTIGRAVITY NATIVE
  </text>
</svg>
